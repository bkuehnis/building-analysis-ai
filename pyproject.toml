[project]
name = "building-analysis-ai"
version = "0.1.0"
description = "PA modular project for generating PDF documents from building addresses and extracting structured data from Werk-material building datasets."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
  "joblib==1.5.3",
  "numpy==2.2.6",
  "openai==2.13.0",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pillow==12.0.0",
  "pydantic==2.12.4",
  "python-dotenv==1.2.1",
  "requests==2.32.5",
  "scikit-learn==1.6.1",
  "streamlit>=1.56.0",
  "catboost>=1.2.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
